<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JISAN BOT — ADMIN PANEL</title><style>:root{font-family:Manrope,Arial,sans-serif;background:#06140c;color:#f7fff9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,rgba(22,163,74,.2),transparent 32%),linear-gradient(145deg,#031008,#071b11 50%,#04121c);padding:22px}.wrap{max-width:1100px;margin:auto}.card{background:rgba(5,25,16,.9);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 20px 70px rgba(0,0,0,.28)}h1{margin:0;font-size:27px;letter-spacing:.04em;text-transform:uppercase}h2{margin:0 0 8px;text-transform:uppercase}.muted{color:#a9bdb0}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}label{display:block;margin-top:18px;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase}input{display:block;width:100%;margin-top:8px;padding:14px 15px;border-radius:13px;border:1px solid rgba(255,255,255,.14);background:#06120c;color:#fff;outline:none}button{font:inherit;border:0;border-radius:13px;padding:13px 17px;background:linear-gradient(135deg,#22c55e,#15803d);color:#fff;font-weight:900;cursor:pointer}button:hover{transform:translateY(-1px)}.tabs{display:flex;gap:10px;margin:8px 0 18px;flex-wrap:wrap}.tab{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}.tab.active{background:#16a34a;border-color:#22c55e}.reject{background:#9f2940}.secondary{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13)}.item{padding:20px}.item+.item{margin-top:14px}.status{font-weight:900;text-transform:uppercase}.pending{color:#facc15}.accepted{color:#57d58b}.rejected{color:#ff7e8b}.disabled{color:#fb923c}.proof{max-width:360px;max-height:500px;width:auto;height:auto;display:block;border-radius:12px;margin:14px 0;border:1px solid rgba(255,255,255,.1)}.meta{display:grid;gap:6px;color:#d9e5dc;margin:12px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.empty{text-align:center;padding:30px;color:#93a69b}.count{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 8px;border-radius:99px;background:rgba(250,204,21,.12);color:#facc15;font-size:12px;margin-left:6px}@media(max-width:600px){body{padding:12px}.card{padding:17px}h1{font-size:22px}.proof{max-width:100%}}</style></head><body><div class="wrap"><div class="card"><h1>JISAN BOT — ADMIN PANEL</h1><p class="muted">PAYMENT REVIEW & ACCESS CONTROL</p><label>ADMIN KEY<input id="key" type="password" autocomplete="off" placeholder="ENTER ADMIN KEY"></label><div class="actions"><button id="load">LOAD PAYMENTS</button><span id="msg" class="muted"></span></div></div><div class="tabs"><button class="tab active" data-view="pending">PENDING <span id="pendingCount" class="count">0</span></button><button class="tab" data-view="reviewed">REVIEWED <span id="reviewedCount" class="count">0</span></button><button class="tab" data-view="disabled">DISABLED <span id="disabledCount" class="count">0</span></button></div><div id="list"></div></div><script src="app.js"></script></body></html>
