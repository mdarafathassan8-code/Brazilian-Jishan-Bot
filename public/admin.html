<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JISAN BOT — ADMIN PANEL</title><link rel="stylesheet" href="/styles.css"></head><body><div class="flag-bg" aria-hidden="true"><div class="flag-wave"><div class="flag-blue"></div></div></div><main class="shell"><section class="brand"><div class="flag-dot">🇧🇷</div><div><span>BRAZILIAN</span><h1>JISAN BOT</h1></div></section><section class="card"><div class="eyebrow">ADMIN CONTROL CENTER</div><h2>PAYMENT REVIEW</h2><p class="muted">PENDING requests are separated from reviewed requests. Payment screenshots are visible only while a request is pending.</p><input id="key" type="password" placeholder="ADMIN KEY" autocomplete="current-password"><div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:18px"><button id="loadBtn" class="primary" onclick="login()">LOGIN & LOAD</button><button id="refreshBtn" class="secondary" onclick="manualRefresh()">↻ REFRESH</button><button id="notifyBtn" class="secondary" onclick="enableNotifications()">🔔 ENABLE NOTIFICATIONS</button><button id="logoutBtn" class="secondary" onclick="logout()">LOGOUT</button></div><p id="adminMsg" class="message"></p></section><section id="panel" class="card hidden"><div class="admin-tabs"><button class="tab active" data-view="pending">PENDING <span id="pendingCount">0</span></button><button class="tab" data-view="reviewed">REVIEWED <span id="reviewedCount">0</span></button><button class="tab" data-view="disabled">DISABLED <span id="disabledCount">0</span></button></div><div id="items" class="markets"></div></section><footer>JISAN BOT · ADMIN PANEL</footer></main><script>
const KEY='bjb_admin_key';let key=localStorage.getItem(KEY)||'',items=[],view='pending',firstLoad=true,lastPendingIds=new Set();const box=document.getElementById('items'),msg=document.getElementById('adminMsg'),input=document.getElementById('key'),panel=document.getElementById('panel');if(key){input.value=key;load()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function logout(){localStorage.removeItem(KEY);key='';input.value='';items=[];lastPendingIds.clear();panel.classList.add('hidden');box.innerHTML='';msg.textContent='Logged out.'}
async function login(){key=input.value.trim();if(!key){msg.textContent='ADMIN KEY দিন।';return}localStorage.setItem(KEY,key);firstLoad=true;await enableNotifications(true);await load()}
async function enableNotifications(silent=false){if(!('Notification' in window)){msg.textContent='BROWSER NOTIFICATION SUPPORT করে না।';return false}try{const p=Notification.permission==='default'?await Notification.requestPermission():Notification.permission;if(p==='granted'){if(!silent)msg.textContent='NOTIFICATIONS ENABLED — KEEP THIS ADMIN PAGE OPEN.';return true}if(!silent)msg.textContent='NOTIFICATION PERMISSION BLOCKED. BROWSER SITE SETTINGS থেকে ALLOW করুন।';return false}catch(e){if(!silent)msg.textContent='NOTIFICATION PERMISSION দেওয়া যায়নি।';return false}}
function notifyNewPending(x){const title='JISAN BOT — NEW PAYMENT';const body=`NEW PENDING REQUEST #${x.id} | REFERENCE: ${x.reference||'NO REFERENCE'}`;if('Notification' in window&&Notification.permission==='granted'){try{const n=new Notification(title,{body,tag:`payment-${x.id}`,requireInteraction:true});n.onclick=()=>{window.focus();setView('pending');n.close()}}catch(e){showAlert(title,body)}}else{showAlert(title,body)}}
function showAlert(title,body){msg.textContent='🔔 '+title+' — '+body;msg.style.fontWeight='700';try{if(navigator.vibrate)navigator.vibrate([250,120,250])}catch(e){}}
function setView(v){view=v;document.querySelectorAll('.admin-tabs .tab').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
document.querySelectorAll('.admin-tabs .tab').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function render(){let list=[];if(view==='pending')list=items.filter(x=>x.status==='pending');else if(view==='reviewed')list=items.filter(x=>['approved','rejected'].includes(x.status));else list=items.filter(x=>x.status==='disabled');document.getElementById('pendingCount').textContent=items.filter(x=>x.status==='pending').length;document.getElementById('reviewedCount').textContent=items.filter(x=>['approved','rejected'].includes(x.status)).length;document.getElementById('disabledCount').textContent=items.filter(x=>x.status==='disabled').length;if(!list.length){box.innerHTML='<div class="loading">NO REQUESTS IN THIS SECTION.</div>';return}box.innerHTML=list.map(x=>{const proof=x.status==='pending'&&x.proof?`<div style="margin-top:16px"><div class="eyebrow" style="font-size:10px">PAYMENT SCREENSHOT</div><a href="${esc(x.proof)}" target="_blank" rel="noopener" style="display:block;margin-top:9px"><img src="${esc(x.proof)}" alt="Payment proof" style="display:block;width:min(100%,420px);max-height:520px;object-fit:contain;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#000"></a></div>`:'';const controls=x.status==='pending'?`<div class="admin-actions"><button class="primary" onclick="act(${x.id},'approve')">ACCEPT</button><button class="secondary" onclick="act(${x.id},'reject')">REJECT</button></div>`:x.status==='approved'?`<div class="admin-actions"><button class="secondary" onclick="act(${x.id},'disable')">DISABLE ACCESS</button></div>`:x.status==='disabled'?`<div class="admin-actions"><button class="primary" onclick="act(${x.id},'enable')">ENABLE ACCESS</button></div>`:'';return `<article class="market admin-card"><strong>#${x.id} · ${esc(String(x.status).toUpperCase())}</strong><span class="pill">${esc(x.reference||'NO REFERENCE')}</span><div class="admin-meta">${esc(x.payment_method||'BINANCE')} · ${esc(x.payment_account||'853973504')}</div><div class="admin-meta">PASSWORD: ${x.password_set?'SET (HIDDEN)':'NOT SET'}</div><div class="admin-meta">${x.created_at?new Date(Number(x.created_at)).toLocaleString():''}</div>${proof}${controls}</article>`}).join('')}
async function load(){if(!key)return;const btn=document.getElementById('refreshBtn');if(btn)btn.disabled=true;try{const r=await fetch('/api/admin/purchases?ts='+Date.now(),{headers:{'x-admin-key':key},cache:'no-store'});const d=await r.json();if(!r.ok){localStorage.removeItem(KEY);key='';msg.textContent=d.error||'Unauthorized';panel.classList.add('hidden');return}const next=d.items||[];const pending=next.filter(x=>x.status==='pending');if(!firstLoad){const newItems=pending.filter(x=>!lastPendingIds.has(Number(x.id)));for(const x of newItems)notifyNewPending(x)}else if(lastPendingIds.size===0){/* Establish baseline on first load so existing requests do not create false alerts. */}lastPendingIds=new Set(pending.map(x=>Number(x.id)));firstLoad=false;items=next;panel.classList.remove('hidden');render();if(msg.textContent==='Refreshing...')msg.textContent='UPDATED — '+new Date().toLocaleTimeString()}catch(e){msg.textContent='SERVER ERROR. PLEASE TRY AGAIN.'}finally{if(btn)btn.disabled=false}}
async function manualRefresh(){if(!key)return login();msg.textContent='Refreshing...';await load()}
async function act(id,a){const r=await fetch('/api/admin/'+a,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({purchase_id:id})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Action failed';return}msg.textContent=a==='approve'?'PAYMENT ACCEPTED. USER CAN SET A PASSWORD.':a==='reject'?'PAYMENT REJECTED.':a==='disable'?'ACCESS DISABLED.':'ACCESS ENABLED.';await load()}
// Poll continuously, including when the tab is backgrounded, so a new request can trigger a notification.
setInterval(()=>{if(key)load()},10000);
</script></body></html>
