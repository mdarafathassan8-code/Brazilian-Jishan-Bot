<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brazilian Jisan Admin</title><link rel="stylesheet" href="/styles.css"></head><body><div class="flag-bg" aria-hidden="true"><div class="flag-wave"><div class="flag-blue"></div></div></div><main class="shell"><section class="brand"><div class="flag-dot">🇧🇷</div><div><span>BRAZILIAN</span><h1>Jisan Admin</h1></div></section><section class="card"><div class="eyebrow">PAYMENT MANAGEMENT</div><h2>Payment Requests</h2><p class="muted">Admin login is remembered on this device. Use Logout when you want to remove it.</p><input id="key" type="password" placeholder="Admin key" autocomplete="current-password"><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button id="loadBtn" class="primary" onclick="login()">LOGIN & LOAD</button><button id="logoutBtn" class="secondary" onclick="logout()">LOGOUT</button></div><p id="adminMsg" class="message"></p><div id="items" class="markets" style="margin-top:18px"></div></section><footer>Payment screenshots are shown for review. User passwords are never displayed in plaintext.</footer></main><script>
const KEY='bjb_admin_key';let key=localStorage.getItem(KEY)||'';const box=document.getElementById('items'),msg=document.getElementById('adminMsg'),input=document.getElementById('key');if(key){input.value=key;load()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function logout(){localStorage.removeItem(KEY);key='';input.value='';box.innerHTML='';msg.textContent='Logged out.'}
async function login(){key=input.value.trim();if(!key){msg.textContent='Admin key দিন।';return}localStorage.setItem(KEY,key);await load()}
async function load(){if(!key)return;const r=await fetch('/api/admin/purchases',{headers:{'x-admin-key':key}});const d=await r.json();if(!r.ok){localStorage.removeItem(KEY);key='';msg.textContent=d.error||'Unauthorized';return}msg.textContent='';box.innerHTML=d.items.map(x=>{const proof=x.proof?`<div style="margin-top:12px"><div style="font-size:12px;font-weight:800;margin-bottom:7px">PAYMENT SCREENSHOT</div><img src="${esc(x.proof)}" alt="Payment proof" style="display:block;width:min(100%,420px);max-height:520px;object-fit:contain;border-radius:14px;border:1px solid rgba(255,255,255,.12);background:#000"></div>`:'';const controls=x.status==='pending'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="primary" onclick="act(${x.id},'approve')">ACCEPT</button><button class="secondary" onclick="act(${x.id},'reject')">REJECT</button></div>`:x.status==='approved'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="secondary" onclick="act(${x.id},'disable')">DISABLE ACCESS</button></div>`:x.status==='disabled'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="primary" onclick="act(${x.id},'enable')">ENABLE ACCESS</button></div>`:'';return `<div class="market" style="display:block;text-align:left"><strong>#${x.id} · ${esc(x.status)}</strong><span class="pill">${esc(x.reference||'NO REFERENCE')}</span><div style="margin-top:8px;font-size:12px">${esc(x.payment_method||'BINANCE')} · ${esc(x.payment_account||'853973504')}</div><div style="margin-top:8px;font-size:12px">Password: ${x.password_set?'SET (hidden)':'NOT SET'}</div>${proof}${controls}</div>`}).join('')||'<div class="loading">No requests.</div>'}
async function act(id,a){const r=await fetch('/api/admin/'+a,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({purchase_id:id})});const d=await r.json();if(!r.ok){msg.textContent=d.error||'Action failed';return}msg.textContent=a==='approve'?'Payment accepted. User will set their own password.':a==='reject'?'Payment rejected.':a==='disable'?'Access disabled.':'Access enabled.';await load()}
</script></body></html>
