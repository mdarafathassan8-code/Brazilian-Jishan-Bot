<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Brazilian Jishan Admin</title><link rel="stylesheet" href="/styles.css"></head><body><main class="shell"><section class="brand"><div class="flag-dot">🇧🇷</div><div><span>BRAZILIAN</span><h1>Jishan Admin</h1></div></section><section class="card"><div class="eyebrow">PAYMENT MANAGEMENT</div><h2>Pending purchases</h2><input id="key" type="password" placeholder="Admin key"><button class="primary" onclick="load()">LOAD REQUESTS</button><div id="items" class="markets" style="margin-top:18px"></div></section><footer>Keep the admin key private.</footer></main><script>async function load(){const key=document.getElementById('key').value;const box=document.getElementById('items');const r=await fetch('/api/admin/purchases',{headers:{'x-admin-key':key}});const d=await r.json();if(!r.ok){box.innerHTML='<div class="error">'+d.error+'</div>';return}box.innerHTML=d.items.map(x=>`<div class="market"><strong>#${x.id} · ${x.status}</strong><span class="pill">${x.reference||'NO REFERENCE'}</span>${x.status==='pending'?`<div style="display:flex;gap:8px;margin-top:12px"><button class="primary" onclick="act(${x.id},'approve','${key}')">ACCEPT</button><button class="secondary" onclick="act(${x.id},'reject','${key}')">REJECT</button></div>`:''}</div>`).join('')||'<div class="loading">No requests.</div>'}async function act(id,a,key){const r=await fetch('/api/admin/'+a,{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify({purchase_id:id})});const d=await r.json();if(d.access_id)alert('Access ID: '+d.access_id+'\nPassword: '+d.password);await load()}</script></body></html>
